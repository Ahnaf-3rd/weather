
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="app">
        <header class="app-header">
            <div class="app-brand">
                <span class="brand-icon"><i class="fas fa-cloud-sun"></i></span>
                <h1>Weather App</h1>
            </div>
            <div class="unit-toggle" id="unitToggle">
                <button class="active" data-unit="metric">°C</button>
                <button data-unit="imperial">°F</button>
            </div>
        </header>

        <form class="search-box" id="searchForm" autocomplete="off">
            <input
            type="text"
            id="searchInput"
            placeholder="Search for a city…"
            aria-label="Search for a city"
            />
            <button type="submit">
                <i class="fas fa-magnifying-glass"></i>
                <span>Search</span>
            </button>
        </form>

        <div class="status-message" id="statusMessage">
            <i class="fas fa-cloud"></i> Enter a city name
        </div>

        <div class="weather-card hidden" id="weatherCard">
            <div class="weather-main">
                <div class="weather-left">
                    <div class="weather-icon-wrap" id="weatherIconWrap">
                        <img id="weatherIcon" src="" alt="Weather icon" />
                    </div>
                    <div>
                        <div class="weather-temp" id="weatherTemp">
                            --<span class="deg-symbol">°</span>
                        </div>
                        <div class="weather-condition" id="weatherCondition">--</div>
                    </div>
                </div>
                <div class="weather-right">
                    <div class="weather-city" id="weatherCity">--</div>
                    <div class="weather-country" id="weatherCountry">--</div>
                    <div class="weather-last-updated" id="weatherUpdated">--</div>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-droplet"></i></span>
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value" id="statHumidity">--%</div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-wind"></i></span>
                    <div class="stat-label">Wind Speed</div>
                    <div class="stat-value" id="statWind">--</div>
                    <div class="stat-sub" id="statWindDir">--</div>
                </div>
                <div class="stat-item" id="uvStat">
                    <span class="stat-icon"><i class="fas fa-sun"></i></span>
                    <div class="stat-label">UV Index</div>
                    <div class="stat-value" id="statUv">--</div>
                    <div class="stat-sub" id="statUvLabel">--</div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon"><i class="fas fa-temperature-high"></i></span>
                    <div class="stat-label">Feels Like</div>
                    <div class="stat-value" id="statFeelsLike">--°</div>
                </div>
            </div>

            <div class="extra-info" id="extraInfo">
                <div class="extra-item">
                    <i class="fas fa-gauge-high"></i>
                    <span>Pressure</span>
                    <span id="extraPressure">-- hPa</span>
                </div>
                <div class="extra-item">
                    <i class="fas fa-eye"></i>
                    <span>Visibility</span>
                    <span id="extraVisibility">-- km</span>
                </div>
                <div class="extra-item">
                    <i class="fas fa-cloud"></i>
                    <span>Clouds</span>
                    <span id="extraClouds">--%</span>
                </div>
                <div class="extra-item">
                    <i class="fas fa-sunrise"></i>
                    <span>Sunrise</span>
                    <span id="extraSunrise">--</span>
                </div>
                <div class="extra-item">
                    <i class="fas fa-sunset"></i>
                    <span>Sunset</span>
                    <span id="extraSunset">--</span>
                </div>
            </div>

            <div class="forecast-section" id="forecastSection">
                <div class="forecast-title">
                    <i class="fas fa-calendar-week"></i> 5-Day Forecast
                </div>
                <div class="forecast-grid" id="forecastGrid">
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
